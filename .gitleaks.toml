# gitleaks' default rules (their `jwt` catches legacy service_role keys) plus Supabase secret-key and database-URL rules; the legacy anon key is allowlisted by its claim, and a publishable key matches no rule: both are public by design.
[extend]
useDefault = true

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key, which bypasses Row Level Security"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "supabase-postgres-url"
description = "Postgres connection string with a password for a hosted Supabase database"
regex = '''postgres(?:ql)?://[^\s:@/]+:([^\s@/]+)@[^\s/:]*\.(?:supabase\.co|pooler\.supabase\.com)\b'''
secretGroup = 1
keywords = ["supabase.co", "pooler.supabase.com"]

# "role":"anon" in the payload, as base64url at each of its three byte alignments; every other JWT still matches `jwt`.
[[allowlists]]
description = "Supabase anon keys: public by design"
targetRules = ["jwt"]
regexes = ['''\.[A-Za-z0-9_-]*(?:InJvbGUiOiJhbm9u|Jyb2xlIjoiYW5v|icm9sZSI6ImFub24i)[A-Za-z0-9_-]*\.''']
