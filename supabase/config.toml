project_id = "CollectionBuddy"

[api]
enabled = true
port = 54321
# public only: the client never queries pg_graphql, so exposing it only added an anon-reachable second query engine.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
# `npm run demo` only; hosted keeps it off, pinned in hosted-auth.json, because sharing trusts the JWT email (design-decisions.md, #634).
enable_anonymous_sign_ins = true
# Matches hosted (hosted-auth.json): a reused refresh token counts as theft.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Local only: e2e signs in with a password and the load test signs up with no mailbox to confirm; hosted is the reverse (hosted-auth.json).
[auth.email]
enable_signup = true
enable_confirmations = false

# Local stack and CI only (production gets `supabase db push`, never this file): the population load test signs up one account per collector.
[auth.rate_limit]
sign_in_sign_ups = 500

[auth.external.google]
enabled   = true
client_id = "env(GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID)"
secret    = "env(GOTRUE_EXTERNAL_GOOGLE_SECRET)"
# skip_nonce_check stays false (the default, pinned in hosted-auth.json): the nonce binds a Google ID token to this web login.
