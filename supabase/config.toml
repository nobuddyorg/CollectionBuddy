project_id = "CollectionBuddy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
# Powers `npm run demo` (see CONTRIBUTING.md's "Try the local demo"
# section): that build signs every visitor in as a fresh anonymous user
# instead of showing the Google button. Anonymous users still get a real
# auth.uid() and the `authenticated` role, so every RLS policy in
# 0006_policies.sql and 0007_storage.sql applies to them unchanged -- this
# only widens who can reach that same role locally, not what it can do.
enable_anonymous_sign_ins = true
# Explicit rather than relying on GoTrue's own defaults (#476): a used
# refresh token is retired and reissuing it is treated as token theft,
# which is what makes a stolen refresh token a one-time-use risk rather
# than a standing one. Matches the hosted project's actual settings
# (checked via the management API's /config/auth endpoint) -- this makes
# that already-true fact visible in the repo instead of implicit.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.external.google]
enabled   = true
client_id = "env(GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID)"
secret    = "env(GOTRUE_EXTERNAL_GOOGLE_SECRET)"
# skip_nonce_check must stay false (the default). It exists for native-SDK
# sign-in; this app uses the standard web redirect flow, where the nonce is
# what binds a Google ID token to this specific login attempt.
