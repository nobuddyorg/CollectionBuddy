name: Start the local Supabase stack
description: "Installs the pinned Supabase CLI and runs `supabase start` from the repo root, applying every migration from scratch. The caller stops it with `supabase stop` under `if: always()`."

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-supabase-cli

    # Anonymous ghcr.io pulls share one rate limit per runner IP; a token makes them count per account.
    - name: Log in to ghcr.io
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Start Supabase
      shell: bash
      working-directory: ${{ github.workspace }}
      run: supabase start
