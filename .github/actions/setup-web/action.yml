name: Set up the web toolchain
description: >-
  Node.js with an npm cache keyed on web/package-lock.json, then `npm ci` in
  web/. Every job that runs anything from web/ starts with this, so the Node
  version and the install step are pinned in one place instead of four.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.x'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: web
      run: npm ci
