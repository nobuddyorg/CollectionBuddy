name: Set up the web toolchain
description: Node.js with an npm cache keyed on web/package-lock.json, then `npm ci --ignore-scripts` in web/; the Node version is pinned here once.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.x'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: web
      # No lifecycle scripts, so a bumped package cannot rewrite node_modules before the deploy build (design-decisions.md, Dependabot auto-merge).
      run: npm ci --ignore-scripts
