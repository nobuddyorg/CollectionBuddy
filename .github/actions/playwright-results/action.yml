name: Publish Playwright results
description: >-
  The job summary for one Playwright run (plus its e2e coverage numbers, if
  any), and the HTML reports kept as artifacts.

inputs:
  title:
    description: Heading the results table gets in the job summary.
    required: true
  tag:
    description: Identifies the run within the summary action.
    required: true
  artifact-name:
    description: Name of the report artifact uploaded when the run failed.
    required: true
  job-status:
    description: >-
      The calling job's `job.status`. Status functions inside a composite
      action see only the action's own steps, so whether the run failed has
      to be passed in rather than asked for with `failure()`.
    required: true
  coverage-artifact-name:
    description: >-
      Name of the e2e coverage report artifact (web/coverage-e2e), uploaded
      regardless of job status -- unlike the Playwright report, it's useful
      to browse on a passing run too, not just to debug a failure.
    required: true

runs:
  using: composite
  steps:
    - uses: daun/playwright-report-summary@31ed947ec7a623d18a66cfd20ef546dc66ef8063 # v4
      with:
        report-file: web/playwright-results.json
        # report-tag only identifies a PR comment (unused here); comment-title
        # is what actually shows as the job summary's heading.
        report-tag: ${{ inputs.tag }}
        comment-title: ${{ inputs.title }}
        job-summary: true
        create-comment: false
        # Emoji, not the default octicons style -- default renders each icon
        # as a remote SVG fetched from a third-party host at summary render
        # time. Emoji also match the coverage/mutation tables.
        icon-style: emojis

    - name: Keep the report from a failed run
      if: inputs.job-status == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: web/playwright-report
        retention-days: 7

    # Runs even when the coverage gate (e2e/coverage.ts) is what failed the
    # job -- mcr.generate() writes the report before that check throws, so
    # it's the one artifact here worth keeping on every run, not just
    # failures.
    - name: Add e2e coverage report to job summary
      if: always()
      shell: bash
      run: |
        if [ -f web/coverage-e2e/coverage-summary.md ]; then
          {
            echo '## 🎭 e2e JS/CSS coverage'
            echo
            cat web/coverage-e2e/coverage-summary.md
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Keep the e2e coverage report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.coverage-artifact-name }}
        path: web/coverage-e2e
        retention-days: 7
        if-no-files-found: ignore
