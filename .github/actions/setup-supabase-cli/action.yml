name: Set up the Supabase CLI
description: The one Supabase CLI version this repository uses, so CI's local stack and the unattended `db push` in pages-deploy.yml run the same CLI.

runs:
  using: composite
  steps:
    - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
      with:
        version: 2.110.0
