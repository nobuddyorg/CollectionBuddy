version: 2
updates:
  # Actions were not watched by anything until now, which is why
  # upload-pages-artifact sat on a major old enough for GitHub to start
  # forcing its Node 20 runtime onto Node 24 (#237). Grouped into one PR
  # because these move rarely and reviewing five separate bumps of pinned
  # third-party actions is worse than reviewing one.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
