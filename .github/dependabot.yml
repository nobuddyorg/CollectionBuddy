version: 2
updates:
  # Grouped into one PR: these move rarely, and reviewing five separate
  # pinned-action bumps is worse than reviewing one. Actions are pinned by
  # commit hash, so this is the only thing that can move them -- a tag
  # repointed at new code silently does not.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # The hooks in .pre-commit-config.yaml pin their own revisions, and go
  # stale the same way, for the same reason.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
