version: 2
updates:
  # Actions are pinned by commit hash, so a repointed tag never moves them; these bumps are the only thing that does.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # .pre-commit-config.yaml pins its hook revisions the same way.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # @stryker-mutator/vitest-runner needs a matching core major; listed first because Dependabot uses the first matching group.
      stryker:
        patterns:
          - "@stryker-mutator/*"
      # Split by dependency-type: a mixed group reports as direct:production, which auto-merge.yml always sends to a human.
      patch-updates-dev:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
      patch-updates-prod:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
    # @stryker-mutator/core@10 bundles @babel/generator@8, which crashes on this project's TS function-type annotations (`Printer._parameters`). Re-enable once fixed upstream.
    ignore:
      - dependency-name: "@stryker-mutator/*"
        update-types: ["version-update:semver-major"]
