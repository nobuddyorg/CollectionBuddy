version: 2
updates:
  # Grouped into one PR: these move rarely, and reviewing five separate
  # pinned-action bumps is worse than reviewing one. Actions are pinned by
  # commit hash, so this is the only thing that can move them -- a tag
  # repointed at new code silently does not.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # The hooks in .pre-commit-config.yaml pin their own revisions, and go
  # stale the same way, for the same reason.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # stryker-mutator/vitest-runner requires a matching core major version,
      # so both must land in one PR regardless of update type -- listed
      # first since dependabot uses the first matching group.
      stryker:
        patterns:
          - "@stryker-mutator/*"
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
    # stryker-mutator/core@10.0.0 bundles @babel/generator@8.0.0, which
    # crashes instrumenting this project's TS function-type annotations
    # (TypeError: Cannot read properties of undefined (reading 'length')
    # in Printer._parameters). Re-enable the major-version bump once a
    # fixed stryker-mutator/core or @babel/generator release is out.
    ignore:
      - dependency-name: "@stryker-mutator/*"
        update-types: ["version-update:semver-major"]
