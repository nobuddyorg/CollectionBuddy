name: Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Read-only by default; the two jobs that need to write say so themselves.
# Granting `pages: write` and `id-token: write` at the top handed them to
# every job in the file, including the ones that run `npm ci` and so execute
# third-party install scripts with a token that can publish the site.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The database is deployed before the bundle that depends on it: a
  # frontend referencing a column the database doesn't have yet makes
  # PostgREST reject the query outright, and nothing downstream runs if
  # this fails, so a rejected migration leaves the old bundle deployed
  # against the old schema.
  #
  # The workflow-level `cancel-in-progress` above can cancel this mid-push.
  # Survivable, not good: each migration is its own transaction, so an
  # interrupted push leaves a prefix applied and the rest pending for the
  # next run -- never a half-applied file.
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          # Pinned: an unattended `db push` against production is not the
          # place to discover a CLI behaviour change.
          version: 2.110.0

      # `supabase link` + `--linked` doesn't work here: the push then
      # resolves db.<ref>.supabase.co, which has only an AAAA record, and
      # GitHub runners have no IPv6. The session pooler is reachable over
      # IPv4, so the connection is given explicitly instead.
      #
      # The whole URL is one secret, not assembled from a password here,
      # so GitHub's log masking covers it (a composed string isn't masked)
      # and the password's percent-encoding isn't YAML's problem.
      # Dry run first, so the log names what's about to apply even on a
      # no-op push.
      - name: Show pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # PostgREST answers from a cached schema; a migration that adds a
      # column is invisible until that cache is reloaded. Normally a
      # `pgrst_ddl_watch` event trigger does this automatically -- this
      # project has none, since creating one needs superuser and `postgres`
      # here isn't one.
      #
      # Sent by hand, over the management API rather than the pooler
      # (NOTIFY needs a session `db push` doesn't leave open). Unconditional
      # since it's cheap and not worth reasoning about which migration
      # needed it.
      - name: Reload the PostgREST schema cache
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @- <<'JSON'
          {"query": "notify pgrst, 'reload schema'"}
          JSON
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  build:
    needs: migrate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: test -d out && test -f out/index.html
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  # Runs the end-to-end suite against the *live* deployed site: prerendering
  # runs in Node with real env vars, which can mask client code that breaks
  # once it's just a JS bundle in a browser. Same suite as CI's local
  # export, pointed at another origin -- catches a mismatched base path, a
  # 404'ing icon, a stale CDN asset. Everything in it holds for a
  # signed-out visitor, keeping the run against production read-only.
  smoke_test:
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Through the environment, not the command line: `${{ }}` substitutes
      # before the shell sees it, so a quote-like value would be parsed as
      # shell. E2E_BASE_URL also tells the config not to start its own server.
      - run: npm run e2e
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}

      - name: Keep the report from a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-production
          path: web/playwright-report
          retention-days: 7
