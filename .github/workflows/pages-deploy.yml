name: Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Read-only by default: `pages: write` and `id-token: write` at the top would reach the jobs that run `npm ci` and its install scripts.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Database first: a bundle referencing a column that does not exist yet is rejected by PostgREST, and a failed migration leaves the old bundle on the old schema.
  # `cancel-in-progress` can interrupt this mid-push; each migration is its own transaction, so a prefix applies and the rest waits for the next run.
  # A dispatch may name any branch: only main's reviewed migrations reach production, whose secrets live in the main-only `production` environment.
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-supabase-cli

      # Not `supabase link` + `--linked`: that resolves db.<ref>.supabase.co, which has only an AAAA record, and runners have no IPv6. The URL is one secret so log masking covers it whole.
      - name: Show pending migrations
        id: pending
        run: |
          set -euo pipefail
          result=$(supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --output-format json)
          echo "$result"
          # Anything but an explicit "up to date" takes the backup below.
          case "$(jq -r '.upToDate' <<<"$result")" in
            true) echo "migrations=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "migrations=true" >> "$GITHUB_OUTPUT" ;;
          esac
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Only when something will be applied, so a deploy without migrations never waits on the backup bucket; a failed backup stops the migration.
      - name: Back up before migrating
        if: steps.pending.outputs.migrations == 'true'
        uses: ./.github/actions/backup-database
        with:
          label: pre-migration
          db-url: ${{ secrets.SUPABASE_DB_URL }}
          s3-endpoint: ${{ vars.BACKUP_S3_ENDPOINT }}
          s3-region: ${{ vars.BACKUP_S3_REGION }}
          s3-bucket: ${{ vars.BACKUP_S3_BUCKET }}
          s3-access-key-id: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          age-recipient: ${{ vars.BACKUP_AGE_RECIPIENT }}

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # PostgREST caches the schema and this project cannot create the `pgrst_ddl_watch` event trigger (needs superuser); NOTIFY needs a session, which `db push` does not leave open.
      - name: Reload the PostgREST schema cache
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @- <<'JSON'
          {"query": "notify pgrst, 'reload schema'"}
          JSON
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  build:
    needs: migrate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - run: npm run build
      - run: test -d out && test -f out/index.html
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # The signed-out suite against the live origin: Node prerendering masks failures only the browser bundle shows, and signed-out keeps the run read-only.
  smoke_test:
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - run: npx playwright install --with-deps chromium firefox
      # Through env, not the command line: `${{ }}` substitutes before the shell parses. E2E_BASE_URL also stops the config starting its own server.
      - run: npm run e2e
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}

      - name: Keep the report from a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-production
          path: web/playwright-report
          retention-days: 7
