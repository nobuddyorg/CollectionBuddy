name: Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The database is deployed before the bundle that depends on it, because
  # that is the only order that can't break the live site: a frontend
  # referencing a column the database doesn't have yet makes PostgREST
  # reject the query outright. Nothing downstream runs if this fails, so a
  # rejected migration leaves the old (working) bundle deployed against the
  # old schema rather than a new one against a schema it doesn't match.
  #
  # This job exists because the alternative -- applying migrations by hand
  # -- silently stopped happening: 0009 through 0014 sat unapplied in
  # production for months while the repo and its docs described them as
  # live, including the storage restrictions in 0009.
  #
  # Note the workflow-level `cancel-in-progress` above can cancel this
  # mid-push. That is survivable rather than good: each migration file is
  # its own transaction and is recorded as it lands, so an interrupted push
  # leaves a prefix applied and the rest pending, which the next run
  # continues. It cannot leave a half-applied file behind.
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          # Pinned deliberately: this is the version the migration chain was
          # verified against, and an unattended `db push` against production
          # is not the place to discover a CLI behaviour change.
          version: 2.110.0

      # `supabase link` + `--linked` is the documented path and it does not
      # work here: link reports success but leaves no usable connection
      # behind, and the push then resolves db.<ref>.supabase.co, which has
      # only an AAAA record. GitHub runners have no IPv6, so the first real
      # run of this job died on "IPv6 is not supported on your current
      # network" -- pointing at `supabase link` as the fix, having just run
      # it. The session pooler is reachable over IPv4, so the connection is
      # given explicitly instead of being discovered.
      #
      # The whole URL is one secret rather than assembled here from a
      # password: it keeps GitHub's log masking over the credential (a
      # string composed in a step is not masked), and the password needs
      # percent-encoding that YAML is the wrong place to be doing.
      # Dry run first, so the log names what is about to be applied even on
      # the runs where the push itself turns out to be a no-op.
      - name: Show pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  build:
    needs: migrate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: test -d out && test -f out/index.html
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Loads the *live* deployed page in a real browser and fails if it throws.
  # A successful build isn't enough proof the site works: prerendering runs
  # in Node with real env vars, which can mask client code that silently
  # breaks once it's just a JS bundle in a browser with no Node underneath.
  smoke_test:
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke -- "${{ needs.deploy.outputs.page_url }}"
