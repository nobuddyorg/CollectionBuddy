name: CollectionBuddy Keepalive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Call RPC keepalive
        uses: ./.github/actions/call-keepalive
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          anon-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
