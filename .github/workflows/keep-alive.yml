name: CollectionBuddy Keepalive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Call RPC keepalive
        uses: ./.github/actions/call-keepalive
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          anon-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # On main only: a failed run comments on the production-health issue (docs/how-to/developer-guide.md#watch-production-health).
  report-failure:
    needs: ping
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the checkout that provides the local action
      issues: write # comments on, reopens or opens the production-health issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/report-production-failure
