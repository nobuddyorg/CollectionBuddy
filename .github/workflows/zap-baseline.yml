name: OWASP ZAP baseline scan

# Generic, signed-out dynamic (DAST) scanning of the built app: security
# headers, cookie flags, and passive injection/config probes against the
# rendered pages -- see TEST_STRATEGY.md ("Dynamic scanning (OWASP ZAP
# baseline)") for the full writeup of what this covers.
#
# This is NOT authorization testing and must never be treated as a
# substitute for web/e2e/signed-in/rls.spec.ts, which is the only place
# this app's actual authorization model (RLS, editor grants, anon denial)
# is exercised -- see TEST_STRATEGY.md §7. A green run here says nothing
# about RLS.
#
# Always scans an isolated, ephemeral copy of the built export served on
# the runner itself -- never the deployed site. There is deliberately no
# path from this workflow to any production/staging URL.
#
# A separate workflow from ci.yml on purpose (per #661): this can be
# iterated on, and its thresholds tightened, without touching the required
# PR gate.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/zap-baseline.yml'
      - '.zap/rules.tsv'
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/zap-baseline.yml'
      - '.zap/rules.tsv'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      # NEXT_PUBLIC_SUPABASE_ANON_KEY is the one credential that's fine to
      # bake into a static export (CLAUDE.md guardrail 5); both are already
      # used the same way by ci.yml's build_and_test/mutation_test/lighthouse
      # jobs.
      - name: Build the static export
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # zap-baseline.py always resets its spider to the *host root* of
      # whatever target URL it's given -- any path component is stripped
      # before spidering ("backwards compatibility", docker/zap-baseline.py
      # in zaproxy/zaproxy), so pointing it at .../CollectionBuddy/ directly
      # would silently scan an empty host root instead. The real export only
      # renders correctly under EXPORT_BASE_PATH, though -- next.config.ts
      # bakes it into every asset/navigation URL, the same reason
      # web/scripts/serve-export.mjs exists for Playwright. A self-
      # referencing symlink makes the one built export answer identically at
      # both `/` (what ZAP actually crawls) and `/CollectionBuddy/*` (what
      # the HTML's own URLs point at) -- no second build, nothing rewritten.
      - name: Serve the export at the site root
        working-directory: web
        run: |
          ln -s . out/CollectionBuddy
          npx serve out -l 4173 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4173/ >/dev/null; do sleep 1; done'

      # Baseline = passive only (spider + passive scan rules), never an
      # active scan -- deliberately out of scope per #661. `-I` means only a
      # rule this repo has explicitly promoted to FAIL in .zap/rules.tsv can
      # fail this job; everything else still lands in the report/artifact
      # for human triage, the same graduated-severity split this repo
      # already uses for Opengrep (ci.yml), axe-core (e2e/axe.ts), and
      # Lighthouse (scripts/lighthouse.mjs).
      - name: ZAP baseline scan (signed-out surface only)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:4173/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

      # The action writes report_md.md into the workspace root (the `-w`
      # flag baked into its own zap-baseline.py invocation) in addition to
      # uploading it as part of the zap-baseline-report artifact -- same
      # tee-and-cat pattern ci.yml already uses for depcruise/knip/pgTAP,
      # just with the report file written for us instead of by us.
      - name: Add ZAP scan results to job summary
        if: always()
        run: |
          {
            echo '## 🕷️ OWASP ZAP baseline scan'
            echo
            cat report_md.md 2>/dev/null || echo '_The scan did not complete far enough to produce a report -- see the step above._'
          } >> "$GITHUB_STEP_SUMMARY"
