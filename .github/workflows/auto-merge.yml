name: "Dependabot Auto-Merge"

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
        branches:
            - main

permissions:
    pull-requests: write
    contents: write

jobs:
    auto-approve-merge:
        runs-on: ubuntu-latest
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}

        steps:
            - name: Fetch Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
              with:
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            # Patch-level devDependency bumps only (#290). `--auto` merges the
            # moment every *required* status check passes -- which is only as
            # safe as that required list is complete, and until now it held
            # only build_and_test, not e2e_local_stack (the RLS regression
            # suite) or prek (where zizmor runs). Both are now required on
            # main, so `--auto` waits on the full suite rather than a subset
            # of it.
            #
            # That still isn't enough on its own: a malicious patch release
            # doesn't have to break any test to run a payload from a
            # postinstall script or the shipped module itself, and a merge to
            # main redeploys the site on the very next push. Scoping this to
            # `direct:development` shrinks what a blind auto-merge can reach --
            # a devDependency never ships in the built bundle, so a compromised
            # one can act on this repository's CI runner but not on every
            # signed-in user's browser. Anything touching a runtime dependency
            # still waits for a human to read the diff.
            - name: Merge devDependency patch-level updates only
              if: |
                  steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
                  steps.metadata.outputs.dependency-type == 'direct:development'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch --auto --repo ${{ github.repository }}
