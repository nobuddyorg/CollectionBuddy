name: "Dependabot Auto-Merge"

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
        branches:
            - main
    schedule:
        - cron: "41 * * * *"

permissions: {}

jobs:
    auto-approve-merge:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        permissions:
            pull-requests: write
            contents: write

        steps:
            - name: Fetch Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
              with:
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            - name: Check out the merge result
              if: |
                  steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
                  steps.metadata.outputs.dependency-type == 'direct:development'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 2

            # The deploy build installs without scripts and runs no code of a `dev: true` lockfile entry, so a bump that changes only those never reaches users (design-decisions.md).
            - name: Check the bump changes only dev-only lockfile entries
              id: lockfile
              if: |
                  steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
                  steps.metadata.outputs.dependency-type == 'direct:development'
              run: |
                  set -euo pipefail
                  reaching=$(git show HEAD^1:web/package-lock.json | jq -r --slurpfile head web/package-lock.json '
                    .packages as $base | $head[0].packages | to_entries[]
                    | select(.key != "" and .value != $base[.key] and .value.dev != true) | .key')
                  if [ -n "$reaching" ]; then
                    echo "::notice::Left for review: the deploy build installs $(tr '\n' ' ' <<<"$reaching")"
                    echo "dev-only=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "dev-only=true" >> "$GITHUB_OUTPUT"
                  fi

            # `--auto` waits for every *required* check, so branch protection must require e2e_local_stack and prek, not only build_and_test.
            - name: Merge devDependency patch-level updates only
              if: steps.lockfile.outputs.dev-only == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch --auto --repo ${{ github.repository }}

    # A merge made with GITHUB_TOKEN starts no push run, so without this the bump would first be tested and deployed inside the next human merge.
    catch-up-ci:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: github.event_name == 'schedule'
        permissions:
            actions: write # dispatches ci.yml: workflow_dispatch is the event GITHUB_TOKEN may still start a run with
            contents: read # main's tip
        steps:
            - name: Run CI on main's tip if nothing has
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
                  runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$tip" \
                    --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | length')
                  if [ "$runs" != 0 ]; then
                    echo "CI already ran on $tip."
                    exit 0
                  fi
                  echo "::notice::No CI run on main's tip $tip; dispatching one, which deploys it once green."
                  gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"

    # A failed catch-up leaves an auto-merged bump undeployed, so it comments on the production-health issue (docs/how-to/developer-guide.md#watch-production-health).
    report-failure:
        needs: catch-up-ci
        if: failure() && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read # the checkout that provides the local action
            issues: write # comments on, reopens or opens the production-health issue
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/report-production-failure
