name: "Dependabot Auto-Merge"

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
        branches:
            - main

permissions:
    pull-requests: write
    contents: write

jobs:
    auto-approve-merge:
        runs-on: ubuntu-latest
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}

        steps:
            - name: Fetch Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
              with:
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            # Patch-level devDependency bumps only. `--auto` merges once every
            # *required* status check passes, which must include
            # e2e_local_stack and prek, not just build_and_test.
            #
            # Scoped to `direct:development`: a devDependency never ships in
            # the built bundle, so a compromised one can act on this repo's
            # CI runner but not on every signed-in user's browser. Anything
            # touching a runtime dependency still waits for a human.
            - name: Merge devDependency patch-level updates only
              if: |
                  steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
                  steps.metadata.outputs.dependency-type == 'direct:development'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch --auto --repo ${{ github.repository }}
