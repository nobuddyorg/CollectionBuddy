name: "Dependabot Auto-Merge"

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
        branches:
            - main

permissions:
    pull-requests: write
    contents: write

jobs:
    auto-approve-merge:
        runs-on: ubuntu-latest
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}

        steps:
            - name: Fetch Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
              with:
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            # `direct:development` only: a devDependency reaches the CI runner, a runtime one reaches every user's browser (TEST_STRATEGY.md §13).
            # `--auto` waits for every *required* check, so branch protection must require e2e_local_stack and prek, not only build_and_test.
            - name: Merge devDependency patch-level updates only
              if: |
                  steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
                  steps.metadata.outputs.dependency-type == 'direct:development'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch --auto --repo ${{ github.repository }}
