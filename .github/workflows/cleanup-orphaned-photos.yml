name: Clean up orphaned photographs
# The client deletes Storage objects before the row, so a failed second step leaks bytes; this sweep is the other half of that trade-off (docs/explanation/design-decisions.md).
# Three invariants (CLAUDE.md, TEST_STRATEGY.md §12), kept in orphan_sweep_plan() (0022): match both path_full and path_thumb, never cast a path to uuid, keep the 48h grace period.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted, and delete nothing"
        type: boolean
        default: true
      allow_mass_delete:
        description: "Delete even when more objects are orphaned than max(50, 5% of the bucket)"
        type: boolean
        default: false

permissions: {}

jobs:
  # Main's reviewed sweep only; the Management token lives in the main-only `production` environment.
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Find and remove orphaned Storage objects
        run: |
          set -euo pipefail

          # Bounds the query's response and this run's deletes; the next daily run takes the rest.
          MAX_OBJECTS_PER_RUN=10000
          # The selection and its three invariants live in 0022's orphan_sweep_plan(), which pgTAP runs (080_orphan_sweep_test.sql).
          QUERY="select * from public.orphan_sweep_plan($MAX_OBJECTS_PER_RUN);"

          payload=$(jq -n --arg q "$QUERY" '{query: $q}')
          result=$(curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")

          count=$(echo "$result" | jq -r '.[0].object_count')
          bytes=$(echo "$result" | jq -r '.[0].total_bytes')
          orphans=$(echo "$result" | jq -r '.[0].orphan_count')
          ceiling=$(echo "$result" | jq -r '.[0].deletion_ceiling')

          # An unexpected response shape must not read as "nothing to do" or feed `null` into the delete below.
          for value in "$count" "$bytes" "$orphans" "$ceiling"; do
            case "$value" in
              ''|*[!0-9]*)
                echo "Unexpected query result: $result" >&2
                exit 1
                ;;
            esac
          done

          if [ "$count" = "0" ]; then
            echo "Nothing orphaned older than 48h. Nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Found $orphans orphaned object(s); this run takes the oldest $count, $bytes bytes." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$orphans" -gt "$ceiling" ]; then
            echo "That is more than the mass-deletion ceiling of $ceiling, max(50, 5% of the bucket); a real run needs allow_mass_delete." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # Before the secret key is fetched, so a dry run never puts that credential on the runner. A scheduled run sends no inputs, so DRY_RUN and ALLOW_MASS_DELETE are empty.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            {
              echo "Dry run -- deleting nothing. Would remove:"
              echo "$result" | jq -r '.[0].paths[]' | sed 's/^/  /'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Lost images rows (a bad migration, hosted-editor SQL, an old restore) look exactly like mass orphaning; stop before the key is fetched.
          if [ "$orphans" -gt "$ceiling" ] && [ "${ALLOW_MASS_DELETE:-false}" != "true" ]; then
            {
              echo "Refusing to delete: $orphans orphaned object(s) is more than the ceiling of $ceiling."
              echo "If images rows were lost, disable this workflow and restore first: docs/how-to/developer-guide.md#restore-production-from-a-backup."
              echo "If every listed object is truly orphaned: review a dry run, then run this workflow by hand with dry_run off and allow_mass_delete on."
            } | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi

          # Only Storage deletes bytes, and only the service_role role reaches every prefix: a secret key if one exists, else the legacy service_role JWT, fetched per run, never stored.
          secret_key=$(curl -sS --fail-with-body \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '[(.[] | select(.type == "secret")), (.[] | select(.name == "service_role"))] | first | .api_key // empty')

          # A value fetched at run time is not a registered secret, so Actions does not mask it on its own.
          echo "::add-mask::$secret_key"

          if [ -z "$secret_key" ]; then
            echo "Could not read a secret or service_role key; refusing to continue." >&2
            exit 1
          fi

          # A secret key is not a JWT, so it goes on `apikey` alone; only the legacy JWT also rides as the Bearer token.
          auth=(-H "apikey: $secret_key")
          case "$secret_key" in sb_*) ;; *) auth+=(-H "Authorization: Bearer $secret_key") ;; esac

          # Storage's bulk delete refuses more than 1,000 objects per request.
          echo "$result" \
            | jq -c '.[0].paths | range(0; length; 1000) as $i | {prefixes: .[$i:$i + 1000]}' \
            | while IFS= read -r remove_payload; do
                curl -sS --fail-with-body -X DELETE \
                  "$NEXT_PUBLIC_SUPABASE_URL/storage/v1/object/item-images" \
                  "${auth[@]}" \
                  -H "Content-Type: application/json" \
                  --data "$remove_payload" > /dev/null
              done

          echo "Removed $count orphaned object(s), reclaiming $bytes bytes." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$orphans" -gt "$count" ]; then
            echo "Hit the per-run cap of $MAX_OBJECTS_PER_RUN; the next run continues with the other $((orphans - count))." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_MASS_DELETE: ${{ inputs.allow_mass_delete }}
