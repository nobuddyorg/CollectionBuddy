name: Clean up orphaned photographs
# The client deletes Storage objects before the row, so a failed second step leaks bytes; this sweep is the other half of that trade-off (docs/explanation/design-decisions.md).
# Three invariants (CLAUDE.md, TEST_STRATEGY.md §12): match both path_full and path_thumb, never cast a path to uuid, keep the 48h grace period.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted, and delete nothing"
        type: boolean
        default: true

permissions: {}

jobs:
  # Main's reviewed sweep only; the Management token lives in the main-only `production` environment.
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Find and remove orphaned Storage objects
        run: |
          set -euo pipefail

          # 48h: useItemImages.tsx writes both objects before inserting the row that names them, so nothing mid-upload can look orphaned.
          # Two `not exists` rather than one `or`, so each uses its own unique index (0003_tables.sql, 0005_indexes.sql).
          # Text compared to text cannot raise; a uuid cast of a malformed path would abort the whole query instead of not matching.
          read -r -d '' QUERY <<'SQL' || true
          select
            json_agg(batch.name) as paths,
            count(*) as object_count,
            coalesce(sum((batch.metadata->>'size')::bigint), 0) as total_bytes
          from (
            select o.name, o.metadata
            from storage.objects o
            where o.bucket_id = 'item-images'
              and o.created_at < now() - interval '48 hours'
              and not exists (
                select 1 from public.images im where im.path_full = o.name
              )
              and not exists (
                select 1 from public.images im where im.path_thumb = o.name
              )
            order by o.created_at
            limit $MAX_OBJECTS_PER_RUN
          ) batch;
          SQL

          # Bounds the query's response and this run's deletes; the next daily run takes the rest.
          MAX_OBJECTS_PER_RUN=10000
          # shellcheck disable=SC2016 # the single-quoted pattern is the heredoc's literal placeholder, meant not to expand
          QUERY=${QUERY//'$MAX_OBJECTS_PER_RUN'/$MAX_OBJECTS_PER_RUN}

          payload=$(jq -n --arg q "$QUERY" '{query: $q}')
          result=$(curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")

          count=$(echo "$result" | jq -r '.[0].object_count')
          bytes=$(echo "$result" | jq -r '.[0].total_bytes')

          # An unexpected response shape must not read as "nothing to do" or feed `null` into the delete below.
          case "$count" in
            ''|*[!0-9]*)
              echo "Unexpected query result (object_count='$count'): $result" >&2
              exit 1
              ;;
          esac

          if [ "$count" = "0" ]; then
            echo "Nothing orphaned older than 48h. Nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Found $count orphaned object(s), $bytes bytes." | tee -a "$GITHUB_STEP_SUMMARY"

          # Before the service_role key is fetched, so a dry run never puts that credential on the runner. A scheduled run sends no inputs, so DRY_RUN is empty.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            {
              echo "Dry run -- deleting nothing. Would remove:"
              echo "$result" | jq -r '.[0].paths[]' | sed 's/^/  /'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only the Storage API deletes bytes, and only service_role reaches another user's prefix. Fetched per run rather than stored as a second long-lived secret.
          service_role_key=$(curl -sS --fail-with-body \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')

          # A value fetched at run time is not a registered secret, so Actions does not mask it on its own.
          echo "::add-mask::$service_role_key"

          if [ -z "$service_role_key" ] || [ "$service_role_key" = "null" ]; then
            echo "Could not read the service_role key; refusing to continue." >&2
            exit 1
          fi

          # Storage's bulk delete refuses more than 1,000 objects per request.
          echo "$result" \
            | jq -c '.[0].paths | range(0; length; 1000) as $i | {prefixes: .[$i:$i + 1000]}' \
            | while IFS= read -r remove_payload; do
                curl -sS --fail-with-body -X DELETE \
                  "$NEXT_PUBLIC_SUPABASE_URL/storage/v1/object/item-images" \
                  -H "apikey: $service_role_key" \
                  -H "Authorization: Bearer $service_role_key" \
                  -H "Content-Type: application/json" \
                  --data "$remove_payload" > /dev/null
              done

          echo "Removed $count orphaned object(s), reclaiming $bytes bytes." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$count" = "$MAX_OBJECTS_PER_RUN" ]; then
            echo "Hit the per-run cap of $MAX_OBJECTS_PER_RUN; the next run continues." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
