name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Unconditional: hygiene must see every changed file, the secret scan every commit. The web hooks are skipped because build_and_test runs the same commands.
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The hook's own version (.pre-commit-config.yaml); the checksum is the release's gitleaks_<version>_checksums.txt entry.
      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # Every commit HEAD reaches, the PR's own included even if a later one removes the secret; the hook sees only staged changes, so it is skipped below.
      - name: Scan the history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts=HEAD .

      # An edited, renamed or deleted migration makes every later `supabase db push` fail (docs/how-to/developer-guide.md#roll-back-a-bad-deploy).
      - name: Check the migration history only grows
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: supabase/check-migration-history.sh "$BASE"

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: "--all-files"
        env:
          SKIP: no-commit-to-branch,gitleaks,prettier,eslint,tsc,depcruise,knip

  # A push to main forces every job: Deploy Pages waits for this whole run to pass, and a merge may combine unrelated changes.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.force.outputs.value == 'true' || steps.filter.outputs.web == 'true' }}
      sql: ${{ steps.force.outputs.value == 'true' || steps.filter.outputs.sql == 'true' }}
    steps:
      - name: Force a full run on pushes to main
        id: force
        run: echo "value=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # ci.yml is in both filters so a change to this file always exercises what it changed; the sweep runs 0022's pgTAP-tested query.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.zap/rules.tsv'
              - '.github/workflows/ci.yml'
            sql:
              - 'supabase/migrations/**'
              - 'supabase/tests/database/**'
              - 'supabase/splinter.sh'
              - '.sqlfluff'
              - '.github/workflows/cleanup-orphaned-photos.yml'
              - '.github/workflows/ci.yml'

  build_and_test:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # After the build: `next build` generates the gitignored next-env.d.ts that tsc and ESLint need.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      # `shell: bash` adds pipefail; the implicit `bash -e` would report tee's status, not the command's.
      - name: Check architectural boundaries
        shell: bash
        run: npm run depcruise 2>&1 | tee depcruise-output.txt

      - name: Add architecture check to job summary
        if: always()
        uses: ./.github/actions/summary-section
        with:
          title: '🏗️ Architectural boundaries (dependency-cruiser)'
          file: web/depcruise-output.txt

      # `--silent` drops npm's own banner: Knip prints nothing when clean, so an empty file means clean.
      - name: Check for dead code and unused dependencies
        shell: bash
        run: npm run --silent knip 2>&1 | tee knip-output.txt

      - name: Add dead-code check to job summary
        if: always()
        uses: ./.github/actions/summary-section
        with:
          title: '🧹 Dead code and unused dependencies (Knip)'
          file: web/knip-output.txt
          empty-message: '✅ No unused files, exports or dependencies.'

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        # v5.5.1 fetched Codecov's GPG key from a Keybase account Codecov has since deleted; v7 carries the key.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: web/coverage
          fail_ci_if_error: true

      # Reads the json-summary reporter vitest.config.mts adds for this step.
      - name: Add coverage report to job summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2
        with:
          working-directory: web
          vite-config-path: vitest.config.mts
          file-coverage-mode: none
          comment-on: 'none'
          # No threshold-icons: setting them forces one shared cutoff for all four categories and warns on every run.

      # Firefox and the production-config bundle live only here; coverage is e2e_local_stack's job. Playwright serves the export under the base path itself (playwright.config.ts).
      - name: Install browsers for the end-to-end suite
        run: npx playwright install --with-deps chromium firefox

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Publish the end-to-end results
        if: always()
        uses: ./.github/actions/playwright-results
        with:
          title: 'End-to-end tests -- signed-out (public)'
          tag: 'e2e (signed-out)'
          artifact-name: playwright-report
          job-status: ${{ job.status }}

  # Schema, pgTAP and the signed-in journeys share one running stack, so either `web` or `sql` changing runs the whole job.
  e2e_local_stack:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      # A migration that cannot apply from scratch fails here, not in production.
      - uses: ./.github/actions/start-local-stack

      # Before the browser install: a schema or RLS regression fails in seconds. Division of labor with e2e/signed-in/rls/: TEST_STRATEGY.md §7.
      - name: Run pgTAP database tests
        working-directory: .
        shell: bash
        run: supabase test db 2>&1 | tee pgtap-output.txt

      - name: Add pgTAP results to job summary
        if: always()
        uses: ./.github/actions/summary-section
        with:
          title: '🐘 pgTAP database tests'
          file: pgtap-output.txt

      # The hosted dashboard's Advisors, on the same stack; what the script excuses, and why, is listed in it.
      - name: Run Splinter (Supabase Advisors lints)
        id: splinter
        working-directory: .
        shell: bash
        run: supabase/splinter.sh 2>&1 | tee splinter-output.txt

      - name: Add Splinter results to job summary
        if: always() && steps.splinter.outcome != 'skipped'
        uses: ./.github/actions/summary-section
        with:
          title: '🩺 Splinter (Supabase Advisors lints)'
          file: splinter-output.txt

      # Raw CLI output is unformatted, so it goes through the project's Prettier config before the diff; the checked-in header is carried over.
      - name: Verify database.types.ts matches the schema
        working-directory: .
        run: |
          supabase gen types typescript --local > /tmp/database.types.body.ts
          web/node_modules/.bin/prettier --config web/.prettierrc --write /tmp/database.types.body.ts
          awk '/^export type Json =/{exit} {print}' web/src/app/data/database.types.ts > /tmp/database.types.expected.ts
          cat /tmp/database.types.body.ts >> /tmp/database.types.expected.ts
          diff -u web/src/app/data/database.types.ts /tmp/database.types.expected.ts

      - run: npx playwright install --with-deps chromium

      # Same script a developer runs, so the two cannot drift.
      - name: Run the signed-in end-to-end suite
        run: npm run e2e:local

      - name: Publish the end-to-end results
        if: always()
        uses: ./.github/actions/playwright-results
        with:
          title: 'End-to-end tests -- full suite (local stack)'
          tag: 'e2e (full suite, local stack)'
          artifact-name: playwright-report-signed-in
          coverage-artifact-name: e2e-coverage-signed-in
          job-status: ${{ job.status }}

      - name: Stop Supabase
        if: always()
        run: supabase stop
        working-directory: .

  # Scoped to mutation-targets.mjs (stryker.config.mjs); nothing there is affected by a SQL-only change.
  mutation_test:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      # Stryker's incremental file (#714); a PR restores main's latest. Keyed on what incremental mode cannot see: dependencies and test config.
      - name: Restore the incremental mutation report
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/reports/stryker-incremental.json
          key: stryker-incremental-${{ hashFiles('web/package-lock.json', 'web/stryker.config.mjs', 'web/vitest.config.mts', 'web/vitest.mutation.config.mts', 'web/vitest.setup.ts') }}-${{ github.run_id }}
          restore-keys: stryker-incremental-${{ hashFiles('web/package-lock.json', 'web/stryker.config.mjs', 'web/vitest.config.mts', 'web/vitest.mutation.config.mts', 'web/vitest.setup.ts') }}-

      # No Supabase env: the unit suite never reads it. Dashboard key only on main, so the published report and badge track one branch.
      # main reruns every mutant (--force): incremental is blind to modules a target imports, and main's run seeds every PR's cache.
      - name: Run mutation testing
        run: npx stryker run ${FULL_RUN:+--force}
        env:
          FULL_RUN: ${{ github.ref == 'refs/heads/main' && 'true' || '' }}
          STRYKER_DASHBOARD_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}

      # Built from reports/mutation/mutation.json (scripts/mutation-summary.mjs); the console log is mostly expected per-mutant failures.
      - name: Add mutation report to job summary
        if: always()
        run: npm run mutation:summary

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: web/reports/mutation
          retention-days: 30

  # Opengrep needs no node_modules, so it is its own job. The scanned tree is web/{src,scripts,e2e} and supabase/, hence the `web` or `sql` gate.
  opengrep:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `shell: bash` adds pipefail, so a failed download cannot pipe an empty script into bash and pass.
      - name: Install Opengrep
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash -s -- -v v1.30.0
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

      # `--config auto` fetches the public community pack anonymously. .semgrepignore is the one suppression file; Opengrep scans only git-tracked files.
      - name: Run Opengrep
        run: |
          opengrep scan \
            --config auto \
            --sarif-output=opengrep-results.sarif \
            --json-output=opengrep-results.json \
            web/src web/scripts web/e2e supabase

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: opengrep-results.sarif
          category: opengrep

      # Opengrep's SARIF leaves a result's `level` unset; severity lives on the rule, so results are joined to their rule once here.
      - name: Join findings to their rule's severity
        run: |
          jq '
            (reduce (.runs[].tool.driver.rules[]) as $rule ({}; .[$rule.id] = ($rule.defaultConfiguration.level // "warning"))) as $levelById
            | [.runs[].results[] | {
                level: ($levelById[.ruleId] // "warning"),
                ruleId,
                message: .message.text,
                file: (.locations[0].physicalLocation.artifactLocation.uri // "?"),
                line: (.locations[0].physicalLocation.region.startLine // 1)
              }]
          ' opengrep-results.sarif > opengrep-findings.json

      - name: Add scan results to job summary
        if: always()
        run: |
          {
            echo '## 🔍 General-purpose SAST (Opengrep)'
            echo
            jq -r '
              length as $total
              | (map(select(.level == "error")) | length) as $errors
              | "**Total findings:** \($total) (\($errors) at error severity -- blocking; full detail in the Security tab, category `opengrep`)\n"
              + (if $total > 0
                 then "\n| Severity | Rule | Location |\n|---|---|---|\n" + (
                   sort_by(.level != "error", .level != "warning")
                   | map("| \(.level) | `\(.ruleId)` | \(.file):\(.line) |")
                   | join("\n")
                 )
                 else "" end)
            ' opengrep-findings.json
            # SARIF carries a parse error as free text only; the JSON output names its file.
            jq -r '
              [.errors[] | select(.path) | {
                path,
                line: (.spans[0].start.line // "?"),
                kind: (.type | if type == "array" then .[0] else . end)
              }]
              | sort_by(.line)
              | unique_by(.path)
              | length as $count
              | "\n**Partially analyzed files:** \($count) (no finding in their unparsed lines is reported; see the developer guide, Run Opengrep)\n"
              + (if $count > 0
                 then "\n| File | First error at line | Error |\n|---|---|---|\n"
                   + (map("| \(.path) | \(.line) | \(.kind) |") | join("\n"))
                 else "" end)
            ' opengrep-results.json
          } >> "$GITHUB_STEP_SUMMARY"

      # After the upload, so the Security tab stays populated either way. WARNING/INFO stay report-only.
      - name: Fail on error-severity findings
        run: |
          count=$(jq 'map(select(.level == "error")) | length' opengrep-findings.json)
          if [ "$count" -gt 0 ]; then
            jq -r '
              map(select(.level == "error"))[]
              | "::error file=\(.file),line=\(.line)::\(.ruleId): \(.message)"
            ' opengrep-findings.json
            echo "$count error-severity Opengrep finding(s) -- see the annotations above, the job summary, or the Security tab (category opengrep)."
            exit 1
          fi
          echo "No error-severity findings."

  # Against the production export served as Pages serves it (scripts/serve-export.mjs), never `next dev`. Accessibility is axe-core's gate (e2e/axe.ts), not asserted twice.
  lighthouse:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      # Both builds point at this stack (scripts/lighthouse.mjs) rather than at repo secrets.
      - uses: ./.github/actions/start-local-stack

      - run: npx playwright install --with-deps chromium

      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Add Lighthouse scores to job summary
        if: always()
        run: npm run lighthouse:summary

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: web/lighthouse-reports
          retention-days: 30

      - name: Stop Supabase
        if: always()
        run: supabase stop
        working-directory: .

  # Passive scan only; a green run says nothing about RLS (TEST_STRATEGY.md §6). The demo-mode pass exists because the login page alone renders almost nothing.
  zap_baseline:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/start-local-stack

      - name: Point the build at the local stack
        run: |
          status=$(supabase status -o json)
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL <<< "$status")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r .PUBLISHABLE_KEY <<< "$status")" >> "$GITHUB_ENV"
        working-directory: .

      - name: Build the signed-out export
        run: npm run build

      # zap-baseline.py strips any path from its target and spiders the host root; the symlink makes one export answer at both `/` and `/CollectionBuddy/`.
      - name: Serve the signed-out export at the site root
        run: |
          ln -s . out/CollectionBuddy
          npx serve out -l 4173 &
          echo $! > /tmp/zap-serve.pid
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4173/ >/dev/null; do sleep 1; done'

      # `-I`: only a rule promoted to FAIL in .zap/rules.tsv fails the job; the rest lands in the report for triage.
      - name: ZAP baseline scan -- signed out
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:4173/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report-signed-out'

      # The action writes report_json.json into the workspace root; rendered before the signed-in pass overwrites it.
      - name: Add the signed-out ZAP results to the job summary
        if: always()
        run: npm run zap:summary -- --title '🕷️ OWASP ZAP baseline scan -- signed out' ../report_json.json

      # `next build` does not expect the self-referencing symlink, and a lingering `serve` would hold the port.
      - name: Stop the signed-out server
        if: always()
        run: |
          kill "$(cat /tmp/zap-serve.pid)" 2>/dev/null || true
          rm -f out/CollectionBuddy

      # NEXT_PUBLIC_DEMO_MODE signs every visitor in as a fresh anonymous user; there is no password to script otherwise.
      - name: Build the signed-in (demo mode) export
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'

      - name: Serve the signed-in export at the site root
        run: |
          ln -s . out/CollectionBuddy
          npx serve out -l 4174 &
          echo $! > /tmp/zap-serve.pid
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4174/ >/dev/null; do sleep 1; done'

      - name: ZAP baseline scan -- signed in (demo mode)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:4174/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report-signed-in'

      - name: Add the signed-in ZAP results to the job summary
        if: always()
        run: npm run zap:summary -- --title '🕷️ OWASP ZAP baseline scan -- signed in (demo mode)' ../report_json.json

      - name: Stop the signed-in server
        if: always()
        run: kill "$(cat /tmp/zap-serve.pid)" 2>/dev/null || true

      - name: Stop Supabase
        if: always()
        run: supabase stop
        working-directory: .
