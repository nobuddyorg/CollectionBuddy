name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # The repo-wide hooks from .pre-commit-config.yaml: file hygiene, spell
  # checking, shellcheck, markdownlint, and zizmor's security analysis of
  # these workflows. Runs alongside build_and_test rather than gating it --
  # both take a couple of minutes, and serialising them would double the
  # wait for the first sign of a broken build.
  #
  # The config's ESLint/Prettier/TypeScript hooks are skipped here on
  # purpose. They exist so a developer's commit is checked before it is
  # made, and they run the same three commands build_and_test already runs
  # below; installing web/'s dependencies a second time to repeat them
  # would buy nothing. no-commit-to-branch is meaningless off a working
  # copy.
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: "--all-files"
        env:
          SKIP: no-commit-to-branch,prettier,eslint,tsc

  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Runs after the build, not before: `next build` is what generates
      # next-env.d.ts (gitignored, regenerated by any Next.js command),
      # and tsc/eslint both need it on a clean checkout to resolve the
      # ambient *.png/etc module types it references.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage

      # Replaces a hand-rolled "serve it and curl the root" step, which proved
      # only that a file came back. The suite drives the built export in a
      # real browser, on desktop and a phone viewport, and serves it under the
      # base path the way Pages does -- the previous check served it at the
      # root, where every asset the page asks for is a 404 it never looked at.
      #
      # Playwright starts and stops the server itself (playwright.config.ts).
      - name: Install browsers for the end-to-end suite
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Keep the report from a failed run
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # Scoped to the pure, high-risk modules (see stryker.config.mjs and
  # vitest.config.ts) -- mutating the whole app tree would mean mutating JSX
  # and Tailwind class strings, producing a score that means nothing.
  #
  # Runs on every PR as of #246, not only on pushes to main. It was held back
  # on the theory that it was too slow and would flap; it takes about a minute
  # for 273 mutants, and the score has been 100% throughout, so the argument
  # no longer holds. Finding out on the PR is the entire point -- learning
  # after the merge that a test asserts nothing is learning it too late.
  mutation_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The dashboard key is passed only on main, so the published report and
      # the badge keep tracking one branch. A PR run still breaks on the same
      # threshold; it just doesn't publish.
      - name: Run mutation testing
        run: npx stryker run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRYKER_DASHBOARD_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mutation-report
          path: web/reports/mutation
          retention-days: 30
