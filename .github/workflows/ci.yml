name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # The repo-wide hooks from .pre-commit-config.yaml. Runs first and gates
  # every other job -- it's the fastest check, so a failure here (a bad
  # tsconfig.json, a stray secret, ...) is caught before spending minutes on
  # a build, two browsers, a Supabase stack and a mutation-testing run.
  # ESLint/Prettier/TypeScript/depcruise/knip hooks are skipped: build_and_test
  # already runs those same commands below. Unconditional (unlike the jobs
  # below): file hygiene and secret scanning need to see every changed file
  # regardless of which directory it's in, and sqlfluff-lint here is only
  # ~2s against the fixed migrations/pgTAP set, not worth path-gating.
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: "--all-files"
        env:
          SKIP: no-commit-to-branch,prettier,eslint,tsc,depcruise,knip

  # Decides which of the two expensive job groups below actually need to
  # run. `web` gates the app-code checks (build/tsc/lint/unit tests/mutation
  # testing/signed-out e2e); `sql` OR `web` gates e2e_local_stack, since that
  # job validates both the schema/pgTAP side and the signed-in Playwright
  # journeys together against one running stack, and either changing can
  # break it. `.github/workflows/ci.yml` is in both filters, so a change to
  # this file's own logic always exercises what it just changed. Forced to
  # "true" unconditionally on a push to main: that's the event that
  # triggers pages-deploy.yml's migrate -> build -> deploy, and PRs get the
  # path-filtered speedup while the actual pre-deploy gate stays the full,
  # unconditional run this repo has always had -- a squash-merge combining
  # unrelated changes must never get a job skipped right before it deploys.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.force.outputs.value == 'true' || steps.filter.outputs.web == 'true' }}
      sql: ${{ steps.force.outputs.value == 'true' || steps.filter.outputs.sql == 'true' }}
    steps:
      - name: Force a full run on pushes to main
        id: force
        run: echo "value=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            sql:
              - 'supabase/migrations/**'
              - 'supabase/tests/database/**'
              - '.sqlfluff'
              - '.github/workflows/ci.yml'

  build_and_test:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # After the build, not before: `next build` generates next-env.d.ts
      # (gitignored), which tsc/eslint need on a clean checkout.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Check architectural boundaries
        run: npm run depcruise

      - name: Check for dead code and unused dependencies
        run: npm run knip

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        # v5.5.1 fetched Codecov's GPG key from a Keybase account Codecov has
        # since deleted, failing every upload with "no valid OpenPGP data
        # found". v7 carries the key instead of fetching it.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: web/coverage
          fail_ci_if_error: true

      # Job summary only (codecov.yml disables Codecov's own PR comment) --
      # reads the json-summary reporter vitest.config.mts adds for this.
      - name: Add coverage report to job summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2
        with:
          working-directory: web
          vite-config-path: vitest.config.mts
          file-coverage-mode: none
          comment-on: 'none'
          # No explicit threshold-icons: the action only draws 🔴/🟢 (not the
          # ✅/❌ used below) when left to check each category against its own
          # real threshold automatically. Supplying custom icons forces one
          # shared cutoff for all four categories *and* makes the action emit
          # an unavoidable "thresholds and threshold-icons both defined"
          # warning on every run -- not worth it for a glyph swap on one of
          # three tables.

      # Drives the built export in a real browser, serving it under the base
      # path the way Pages does -- serving at the root would make every
      # asset request a 404 this never caught. Playwright starts and stops
      # the server itself (playwright.config.ts).
      - name: Install browsers for the end-to-end suite
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Publish the end-to-end results
        if: always()
        uses: ./.github/actions/playwright-results
        with:
          title: 'End-to-end tests -- signed-out (public)'
          tag: 'e2e (signed-out)'
          artifact-name: playwright-report
          job-status: ${{ job.status }}

  # The signed-in half of the app, against a real database. Its own job
  # because it needs Docker and a Supabase stack; everything else in CI
  # only covers what a signed-out visitor sees. Goes through the same RLS
  # that is the app's only authorization layer.
  #
  # Sign-in can't go through the interface (Google OAuth, no runner can
  # drive it), so setup mints a session through the auth API into
  # localStorage -- this path exists for the local stack only.
  #
  # Gated on web OR sql changing (see the `changes` job): this is the one
  # job where the two concerns share a running stack, so either side
  # changing needs the whole thing to run.
  e2e_local_stack:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - uses: ./.github/actions/setup-supabase-cli

      - name: Start Supabase
        # From the repo root, where supabase/ lives. Applies every
        # migration, so one that can't apply fails here, not production --
        # which is also what makes this the migration-applies-cleanly test
        # the pgTAP suite below depends on: it never runs against anything
        # but a database that just came up from a fresh `supabase start`.
        run: supabase start
        working-directory: .

      # pg_prove against the local stack (supabase/tests/database/), right
      # after the stack comes up and before the slower Playwright install +
      # run below -- a schema/RLS regression fails here in seconds rather
      # than after paying for browsers too. Complements, not duplicates,
      # the signed-in suite's rls.spec.ts: see TEST_STRATEGY.md for the
      # division of labor between the two.
      - name: Run pgTAP database tests
        working-directory: .
        run: supabase test db

      # Regenerates database.types.ts's body against the stack just started
      # and fails on any difference. Piped through the project's own
      # Prettier config first -- raw CLI output has neither semicolons nor
      # single quotes, so an unformatted diff would flag every line
      # regardless of actual schema drift. The checked-in file's own header
      # is carried over rather than hardcoded here.
      - name: Verify database.types.ts matches the schema
        working-directory: .
        run: |
          supabase gen types typescript --local > /tmp/database.types.body.ts
          web/node_modules/.bin/prettier --config web/.prettierrc --write /tmp/database.types.body.ts
          awk '/^export type Json =/{exit} {print}' web/src/app/data/database.types.ts > /tmp/database.types.expected.ts
          cat /tmp/database.types.body.ts >> /tmp/database.types.expected.ts
          diff -u web/src/app/data/database.types.ts /tmp/database.types.expected.ts

      - run: npx playwright install --with-deps chromium

      # Same script a developer runs, so the two can't drift.
      - name: Run the signed-in end-to-end suite
        run: npm run e2e:local

      - name: Publish the end-to-end results
        if: always()
        uses: ./.github/actions/playwright-results
        with:
          title: 'End-to-end tests -- signed-in (local stack)'
          tag: 'e2e (signed-in, local stack)'
          artifact-name: playwright-report-signed-in
          job-status: ${{ job.status }}

      - name: Stop Supabase
        if: always()
        run: supabase stop
        working-directory: .

  # Scoped to the pure, high-risk modules (stryker.config.mjs) -- mutating
  # the whole app tree would mean mutating JSX and Tailwind class strings,
  # producing a meaningless score. Runs on every PR that touches web code,
  # not just main: finding out a test asserts nothing is only useful before
  # the merge. Gated on web changing (see the `changes` job) -- nothing in
  # mutation-targets.mjs can be affected by a SQL-only or docs-only change.
  mutation_test:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      # Dashboard key passed only on main, so the published report and badge
      # track one branch. A PR run still breaks on the same threshold.
      - name: Run mutation testing
        run: npx stryker run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRYKER_DASHBOARD_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}

      # A table built from reports/mutation/mutation.json (scripts/mutation-summary.mjs),
      # not console output -- the console log is mostly expected per-mutant
      # test "failures" (that's what killing a mutant means), which isn't
      # useful summary material.
      - name: Add mutation report to job summary
        if: always()
        run: npm run mutation:summary

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: web/reports/mutation
          retention-days: 30

  # General-purpose SAST (Opengrep, an LGPL fork of the Semgrep engine),
  # complementing rather than duplicating ESLint/dependency-cruiser (which
  # know this app's own conventions) and CodeQL (dataflow analysis, enabled
  # separately via the repo's default code-scanning setup, not a workflow
  # file here): Opengrep's community rule pack catches generic
  # language-level bug/security patterns neither of those is written to
  # find. A standalone binary with no npm/pip dependency, so its own job
  # rather than a build_and_test step -- nothing here needs web/node_modules.
  # Gated on web or sql changing (see the `changes` job): the scanned tree
  # is exactly web/{src,scripts,e2e} and supabase/, so a docs-only PR has
  # nothing for it to find.
  #
  # `--config auto` resolves to Opengrep's default community pack
  # (semgrep.dev's public `p/default` registry endpoint) -- no account, API
  # key, or registry login involved; it's an anonymous, unauthenticated
  # fetch, the same as CodeQL's own bundled query packs need no credential.
  # No `--error`, so a finding surfaces in the Security tab without failing
  # the job -- the same division CodeQL's default setup uses between
  # findings and job status. No telemetry to disable: Opengrep's source was
  # checked (see TEST_STRATEGY.md) and ships none.
  opengrep:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash -s -- -v v1.30.0
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

      # .semgrepignore (Opengrep's default ignore-file name -- v1.30.0 has no
      # --semgrepignore-filename to rename it) is this repo's one
      # suppression file (gitignore syntax) -- see its own comments for
      # what's excluded and why. Build artifacts need no entry there:
      # Opengrep only scans git-tracked files, and all of them are already
      # in web/.gitignore.
      - name: Run Opengrep
        run: |
          opengrep scan \
            --config auto \
            --sarif-output=opengrep-results.sarif \
            web/src web/scripts web/e2e supabase

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: opengrep-results.sarif
          category: opengrep
