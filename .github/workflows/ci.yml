name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # The repo-wide hooks from .pre-commit-config.yaml: file hygiene, spell
  # checking, shellcheck, markdownlint, and zizmor's security analysis of
  # these workflows. Runs alongside build_and_test rather than gating it --
  # both take a couple of minutes, and serialising them would double the
  # wait for the first sign of a broken build.
  #
  # The config's ESLint/Prettier/TypeScript hooks are skipped here on
  # purpose. They exist so a developer's commit is checked before it is
  # made, and they run the same three commands build_and_test already runs
  # below; installing web/'s dependencies a second time to repeat them
  # would buy nothing. no-commit-to-branch is meaningless off a working
  # copy.
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: "--all-files"
        env:
          SKIP: no-commit-to-branch,prettier,eslint,tsc

  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Runs after the build, not before: `next build` is what generates
      # next-env.d.ts (gitignored, regenerated by any Next.js command),
      # and tsc/eslint both need it on a clean checkout to resolve the
      # ambient *.png/etc module types it references.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage

      # Replaces a hand-rolled "serve it and curl the root" step, which proved
      # only that a file came back. The suite drives the built export in a
      # real browser, on desktop and a phone viewport, and serves it under the
      # base path the way Pages does -- the previous check served it at the
      # root, where every asset the page asks for is a 404 it never looked at.
      #
      # Playwright starts and stops the server itself (playwright.config.ts).
      - name: Install browsers for the end-to-end suite
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Keep the report from a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # The signed-in half of the app, against a real database.
  #
  # Its own job because it needs Docker and a Supabase stack, which the rest
  # of CI does not, and because a stack that fails to start should say so
  # plainly rather than looking like a broken build. Everything the other jobs
  # test is what a signed-out visitor sees; this is the catalogue, search, the
  # map and the entry forms, going through the same row-level security that is
  # the app's only authorization layer.
  #
  # Sign-in cannot go through the interface -- the only way in is Google
  # OAuth, which no runner can drive -- so the suite's setup step mints a
  # session through the auth API and writes it into localStorage. That path
  # exists for the local stack alone: the production run is the signed-out
  # suite, which cannot write anything to a live database.
  e2e_local_stack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          # The same version pages-deploy.yml pins for `db push`, so the
          # migrations are exercised here by the CLI that will apply them.
          version: 2.110.0

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase
        # From the repository root: that is where supabase/ lives. Applies
        # every migration on the way up, so a migration that cannot apply
        # fails here rather than against production.
        run: supabase start
        working-directory: .

      - run: npx playwright install --with-deps chromium

      # Reads the stack's own keys, builds the bundle against it and runs the
      # suite -- the same script a developer runs, so the two cannot drift.
      - name: Run the signed-in end-to-end suite
        run: npm run e2e:local

      - name: Keep the report from a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-signed-in
          path: web/playwright-report
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop
        working-directory: .

  # Scoped to the pure, high-risk modules (see stryker.config.mjs and
  # vitest.config.ts) -- mutating the whole app tree would mean mutating JSX
  # and Tailwind class strings, producing a score that means nothing.
  #
  # Runs on every PR as of #246, not only on pushes to main. It was held back
  # on the theory that it was too slow and would flap; it takes about a minute
  # for 273 mutants, and the score has been 100% throughout, so the argument
  # no longer holds. Finding out on the PR is the entire point -- learning
  # after the merge that a test asserts nothing is learning it too late.
  mutation_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The dashboard key is passed only on main, so the published report and
      # the badge keep tracking one branch. A PR run still breaks on the same
      # threshold; it just doesn't publish.
      - name: Run mutation testing
        run: npx stryker run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRYKER_DASHBOARD_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: web/reports/mutation
          retention-days: 30
