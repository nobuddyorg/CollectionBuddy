name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # The repo-wide hooks from .pre-commit-config.yaml: file hygiene, spell
  # checking, shellcheck, markdownlint, and zizmor's security analysis of
  # these workflows. Runs alongside build_and_test rather than gating it --
  # both take a couple of minutes, and serialising them would double the
  # wait for the first sign of a broken build.
  #
  # The config's ESLint/Prettier/TypeScript hooks are skipped here on
  # purpose. They exist so a developer's commit is checked before it is
  # made, and they run the same three commands build_and_test already runs
  # below; installing web/'s dependencies a second time to repeat them
  # would buy nothing. no-commit-to-branch is meaningless off a working
  # copy.
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: "--all-files"
        env:
          SKIP: no-commit-to-branch,prettier,eslint,tsc

  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Runs after the build, not before: `next build` is what generates
      # next-env.d.ts (gitignored, regenerated by any Next.js command),
      # and tsc/eslint both need it on a clean checkout to resolve the
      # ambient *.png/etc module types it references.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage

      - name: Start Next.js application
        run: npx serve out -l 3000 &

      - name: Wait for application to start
        run: |
          timeout 30s bash -c 'until curl -sSf http://localhost:3000 > /dev/null; do echo "Waiting for app to start..."; sleep 1; done'
          curl -I http://localhost:3000

  # Scoped to a handful of pure, high-risk modules (see stryker.config.mjs
  # and vitest.config.ts) -- mutating the whole app tree would mean mutating
  # JSX and Tailwind class strings, producing a score that means nothing.
  # Runs on push to main rather than per-PR: it's slower than the unit
  # suite, and a flapping break threshold on every PR would get this step
  # deleted rather than fixed.
  mutation_test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing
        run: npx stryker run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mutation-report
          path: web/reports/mutation
          retention-days: 30
