name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # The repo-wide hooks from .pre-commit-config.yaml. Runs first and gates
  # every other job -- it's the fastest check, so a failure here (a bad
  # tsconfig.json, a stray secret, ...) is caught before spending minutes on
  # a build, two browsers, a Supabase stack and a mutation-testing run.
  # ESLint/Prettier/TypeScript/depcruise/knip hooks are skipped: build_and_test
  # already runs those same commands below. Unconditional (unlike the jobs
  # below): file hygiene and secret scanning need to see every changed file
  # regardless of which directory it's in, and sqlfluff-lint here is only
  # ~2s against the fixed migrations/pgTAP set, not worth path-gating.
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: "--all-files"
        env:
          SKIP: no-commit-to-branch,prettier,eslint,tsc,depcruise,knip

  # Decides which of the two expensive job groups below actually need to
  # run. `web` gates the app-code checks (build/tsc/lint/unit tests/mutation
  # testing/signed-out e2e); `sql` OR `web` gates e2e_local_stack, since that
  # job validates both the schema/pgTAP side and the signed-in Playwright
  # journeys together against one running stack, and either changing can
  # break it. `.github/workflows/ci.yml` is in both filters, so a change to
  # this file's own logic always exercises what it just changed. Forced to
  # "true" unconditionally on a push to main: that's the event that
  # triggers pages-deploy.yml's migrate -> build -> deploy, and PRs get the
  # path-filtered speedup while the actual pre-deploy gate stays the full,
  # unconditional run this repo has always had -- a squash-merge combining
  # unrelated changes must never get a job skipped right before it deploys.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.force.outputs.value == 'true' || steps.filter.outputs.web == 'true' }}
      sql: ${{ steps.force.outputs.value == 'true' || steps.filter.outputs.sql == 'true' }}
    steps:
      - name: Force a full run on pushes to main
        id: force
        run: echo "value=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.zap/rules.tsv'
              - '.github/workflows/ci.yml'
            sql:
              - 'supabase/migrations/**'
              - 'supabase/tests/database/**'
              - '.sqlfluff'
              - '.github/workflows/ci.yml'

  build_and_test:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # After the build, not before: `next build` generates next-env.d.ts
      # (gitignored), which tsc/eslint need on a clean checkout.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Check architectural boundaries
        run: npm run depcruise 2>&1 | tee depcruise-output.txt

      - name: Add architecture check to job summary
        if: always()
        run: |
          {
            echo '## 🏗️ Architectural boundaries (dependency-cruiser)'
            echo
            echo '```'
            cat depcruise-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for dead code and unused dependencies
        run: npm run knip 2>&1 | tee knip-output.txt

      - name: Add dead-code check to job summary
        if: always()
        run: |
          {
            echo '## 🧹 Dead code and unused dependencies (Knip)'
            echo
            echo '```'
            cat knip-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        # v5.5.1 fetched Codecov's GPG key from a Keybase account Codecov has
        # since deleted, failing every upload with "no valid OpenPGP data
        # found". v7 carries the key instead of fetching it.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: web/coverage
          fail_ci_if_error: true

      # Job summary only (codecov.yml disables Codecov's own PR comment) --
      # reads the json-summary reporter vitest.config.mts adds for this.
      - name: Add coverage report to job summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2
        with:
          working-directory: web
          vite-config-path: vitest.config.mts
          file-coverage-mode: none
          comment-on: 'none'
          # No explicit threshold-icons: the action only draws 🔴/🟢 (not the
          # ✅/❌ used below) when left to check each category against its own
          # real threshold automatically. Supplying custom icons forces one
          # shared cutoff for all four categories *and* makes the action emit
          # an unavoidable "thresholds and threshold-icons both defined"
          # warning on every run -- not worth it for a glyph swap on one of
          # three tables.

      # Drives the built export in a real browser, serving it under the base
      # path the way Pages does -- serving at the root would make every
      # asset request a 404 this never caught. Playwright starts and stops
      # the server itself (playwright.config.ts).
      - name: Install browsers for the end-to-end suite
        run: npx playwright install --with-deps chromium firefox

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Publish the end-to-end results
        if: always()
        uses: ./.github/actions/playwright-results
        with:
          title: 'End-to-end tests -- signed-out (public)'
          tag: 'e2e (signed-out)'
          artifact-name: playwright-report
          job-status: ${{ job.status }}

  # The signed-in half of the app, against a real database. Its own job
  # because it needs Docker and a Supabase stack; everything else in CI
  # only covers what a signed-out visitor sees. Goes through the same RLS
  # that is the app's only authorization layer.
  #
  # Sign-in can't go through the interface (Google OAuth, no runner can
  # drive it), so setup mints a session through the auth API into
  # localStorage -- this path exists for the local stack only.
  #
  # Gated on web OR sql changing (see the `changes` job): this is the one
  # job where the two concerns share a running stack, so either side
  # changing needs the whole thing to run.
  e2e_local_stack:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - uses: ./.github/actions/setup-supabase-cli

      - name: Start Supabase
        # From the repo root, where supabase/ lives. Applies every
        # migration, so one that can't apply fails here, not production --
        # which is also what makes this the migration-applies-cleanly test
        # the pgTAP suite below depends on: it never runs against anything
        # but a database that just came up from a fresh `supabase start`.
        run: supabase start
        working-directory: .

      # pg_prove against the local stack (supabase/tests/database/), right
      # after the stack comes up and before the slower Playwright install +
      # run below -- a schema/RLS regression fails here in seconds rather
      # than after paying for browsers too. Complements, not duplicates,
      # the signed-in suite's rls.spec.ts: see TEST_STRATEGY.md for the
      # division of labor between the two.
      - name: Run pgTAP database tests
        working-directory: .
        run: supabase test db 2>&1 | tee pgtap-output.txt

      - name: Add pgTAP results to job summary
        if: always()
        working-directory: .
        run: |
          {
            echo '## 🐘 pgTAP database tests'
            echo
            echo '```'
            cat pgtap-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Regenerates database.types.ts's body against the stack just started
      # and fails on any difference. Piped through the project's own
      # Prettier config first -- raw CLI output has neither semicolons nor
      # single quotes, so an unformatted diff would flag every line
      # regardless of actual schema drift. The checked-in file's own header
      # is carried over rather than hardcoded here.
      - name: Verify database.types.ts matches the schema
        working-directory: .
        run: |
          supabase gen types typescript --local > /tmp/database.types.body.ts
          web/node_modules/.bin/prettier --config web/.prettierrc --write /tmp/database.types.body.ts
          awk '/^export type Json =/{exit} {print}' web/src/app/data/database.types.ts > /tmp/database.types.expected.ts
          cat /tmp/database.types.body.ts >> /tmp/database.types.expected.ts
          diff -u web/src/app/data/database.types.ts /tmp/database.types.expected.ts

      - run: npx playwright install --with-deps chromium

      # Same script a developer runs, so the two can't drift.
      - name: Run the signed-in end-to-end suite
        run: npm run e2e:local

      - name: Publish the end-to-end results
        if: always()
        uses: ./.github/actions/playwright-results
        with:
          title: 'End-to-end tests -- signed-in (local stack)'
          tag: 'e2e (signed-in, local stack)'
          artifact-name: playwright-report-signed-in
          job-status: ${{ job.status }}

      - name: Stop Supabase
        if: always()
        run: supabase stop
        working-directory: .

  # Scoped to the pure, high-risk modules (stryker.config.mjs) -- mutating
  # the whole app tree would mean mutating JSX and Tailwind class strings,
  # producing a meaningless score. Runs on every PR that touches web code,
  # not just main: finding out a test asserts nothing is only useful before
  # the merge. Gated on web changing (see the `changes` job) -- nothing in
  # mutation-targets.mjs can be affected by a SQL-only or docs-only change.
  mutation_test:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      # Dashboard key passed only on main, so the published report and badge
      # track one branch. A PR run still breaks on the same threshold.
      - name: Run mutation testing
        run: npx stryker run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRYKER_DASHBOARD_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}

      # A table built from reports/mutation/mutation.json (scripts/mutation-summary.mjs),
      # not console output -- the console log is mostly expected per-mutant
      # test "failures" (that's what killing a mutant means), which isn't
      # useful summary material.
      - name: Add mutation report to job summary
        if: always()
        run: npm run mutation:summary

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: web/reports/mutation
          retention-days: 30

  # General-purpose SAST (Opengrep, an LGPL fork of the Semgrep engine),
  # complementing rather than duplicating ESLint/dependency-cruiser (which
  # know this app's own conventions) and CodeQL (dataflow analysis, enabled
  # separately via the repo's default code-scanning setup, not a workflow
  # file here): Opengrep's community rule pack catches generic
  # language-level bug/security patterns neither of those is written to
  # find. A standalone binary with no npm/pip dependency, so its own job
  # rather than a build_and_test step -- nothing here needs web/node_modules.
  # Gated on web or sql changing (see the `changes` job): the scanned tree
  # is exactly web/{src,scripts,e2e} and supabase/, so a docs-only PR has
  # nothing for it to find.
  #
  # `--config auto` resolves to Opengrep's default community pack
  # (semgrep.dev's public `p/default` registry endpoint) -- no account, API
  # key, or registry login involved; it's an anonymous, unauthenticated
  # fetch, the same as CodeQL's own bundled query packs need no credential.
  # No `--error`, so a finding surfaces in the Security tab without failing
  # the job -- the same division CodeQL's default setup uses between
  # findings and job status. No telemetry to disable: Opengrep's source was
  # checked (see TEST_STRATEGY.md) and ships none.
  opengrep:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash -s -- -v v1.30.0
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

      # .semgrepignore (Opengrep's default ignore-file name -- v1.30.0 has no
      # --semgrepignore-filename to rename it) is this repo's one
      # suppression file (gitignore syntax) -- see its own comments for
      # what's excluded and why. Build artifacts need no entry there:
      # Opengrep only scans git-tracked files, and all of them are already
      # in web/.gitignore.
      - name: Run Opengrep
        run: |
          opengrep scan \
            --config auto \
            --sarif-output=opengrep-results.sarif \
            web/src web/scripts web/e2e supabase

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: opengrep-results.sarif
          category: opengrep

      # jq ships on the runner image; no new dependency for a one-off count.
      # A result's own `level` is unset in Opengrep's SARIF -- severity lives
      # on the rule definition (`tool.driver.rules[].defaultConfiguration.level`,
      # ERROR/WARNING/INFO mapped to error/warning/note), so both this and
      # the enforcement step below join results back to their rule first.
      - name: Add scan results to job summary
        if: always()
        run: |
          {
            echo '## 🔍 General-purpose SAST (Opengrep)'
            echo
            jq -r '
              (reduce (.runs[].tool.driver.rules[]) as $rule ({}; .[$rule.id] = ($rule.defaultConfiguration.level // "warning"))) as $levelById
              | [.runs[].results[] | . + {level: ($levelById[.ruleId] // "warning")}] as $results
              | ($results | length) as $total
              | ($results | map(select(.level == "error")) | length) as $errors
              | "**Total findings:** \($total) (\($errors) at error severity -- blocking; full detail in the Security tab, category `opengrep`)\n"
              + (if $total > 0
                 then "\n| Severity | Rule | Location |\n|---|---|---|\n" + (
                   $results
                   | sort_by(.level != "error", .level != "warning")
                   | map(
                       "| \(.level) | `\(.ruleId)` | \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // "?") |"
                     )
                   | join("\n")
                 )
                 else "" end)
            ' opengrep-results.sarif
          } >> "$GITHUB_STEP_SUMMARY"

      # Everything else in this repo already has a real pass/fail gate
      # (ESLint's --max-warnings 0, depcruise/Knip/SQLFluff's zero-violation
      # default, Stryker's break threshold, axe-core's serious/critical
      # split, Lighthouse's per-category budgets) -- this was the one
      # exception, upload-only regardless of findings. WARNING/INFO stay
      # report-only (community-pack noise and stylistic suggestions are
      # mostly there; a handful of ERROR-adjacent false positives have
      # already been triaged at their `nosemgrep` suppression sites), but
      # an ERROR-severity finding
      # (the pack's own bar for "this is a real bug/vulnerability shape")
      # now fails the job instead of only landing quietly in the Security
      # tab. Runs after the upload above so the tab stays populated either
      # way.
      - name: Fail on error-severity findings
        run: |
          count=$(jq '
            (reduce (.runs[].tool.driver.rules[]) as $rule ({}; .[$rule.id] = ($rule.defaultConfiguration.level // "warning"))) as $levelById
            | [.runs[].results[] | . + {level: ($levelById[.ruleId] // "warning")}]
            | map(select(.level == "error")) | length
          ' opengrep-results.sarif)
          if [ "$count" -gt 0 ]; then
            jq -r '
              (reduce (.runs[].tool.driver.rules[]) as $rule ({}; .[$rule.id] = ($rule.defaultConfiguration.level // "warning"))) as $levelById
              | [.runs[].results[] | . + {level: ($levelById[.ruleId] // "warning")}]
              | map(select(.level == "error"))[]
              | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri // "?"),line=\(.locations[0].physicalLocation.region.startLine // 1)::\(.ruleId): \(.message.text)"
            ' opengrep-results.sarif
            echo "$count error-severity Opengrep finding(s) -- see the annotations above, the job summary, or the Security tab (category opengrep)."
            exit 1
          fi
          echo "No error-severity findings."

  # Lighthouse CI against the real production export -- signed-out (the
  # plain static build) and signed-in (demo mode against the local stack,
  # scripts/lighthouse.mjs), each served exactly as GitHub Pages serves the
  # real site (scripts/serve-export.mjs), never `next dev`. Gated on `web`
  # changing (see the `changes` job): this measures the web bundle/page
  # performance, the same surface `build_and_test`/`mutation_test` gate on,
  # not database behaviour.
  #
  # Accessibility is deliberately not asserted here even though Lighthouse
  # computes it (also axe-core-based): #650 already added a dedicated,
  # more actionable axe-core/Playwright integration
  # (e2e/{public,signed-in}/accessibility.spec.ts), and `onlyCategories`
  # below leaves accessibility out of the run entirely rather than
  # double-gating the same finding through two tools.
  lighthouse:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - uses: ./.github/actions/setup-supabase-cli

      - name: Start Supabase
        run: supabase start
        working-directory: .

      # Both builds point at this stack rather than needing repo secrets,
      # same as e2e_local_stack above.
      - run: npx playwright install --with-deps chromium

      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Add Lighthouse scores to job summary
        if: always()
        run: npm run lighthouse:summary

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: web/lighthouse-reports
          retention-days: 30

      - name: Stop Supabase
        if: always()
        run: supabase stop
        working-directory: .

  # OWASP ZAP baseline (passive-only) DAST scan against isolated, ephemeral
  # copies of the built export -- security headers, cookie flags, and
  # passive injection/error-disclosure probes against real rendered
  # responses, a different angle from Opengrep (source text) and axe-core
  # (a static DOM). Complements, never substitutes for, the authorization
  # testing in e2e_local_stack -- see TEST_STRATEGY.md's §6 "Dynamic
  # scanning (DAST)" section; a green run here says nothing about RLS.
  # Gated on web changing (see the `changes` job), same as
  # build_and_test/mutation_test/lighthouse: this measures the built web
  # bundle's runtime surface, not database behaviour.
  #
  # Two passes, signed-out then signed-in (demo mode) -- matching Lighthouse
  # and axe-core, which already scan both. A login-page-only scan has almost
  # nothing rendered to find an injection/disclosure finding in; the app's
  # actual content (item titles, descriptions, tags, place names) only
  # exists once signed in, which is exactly where #104 (stored HTML
  # injection into a map popup) lived. Both builds point at a local
  # Supabase stack rather than needing repo secrets, mirroring
  # scripts/lighthouse.mjs exactly. Caveat carried over from Lighthouse's
  # own notes: a fresh demo-mode account has zero categories, so the
  # signed-in pass broadens which code paths/bundle get scanned rather than
  # scanning real seeded content -- seeding a fixture item is a reasonable
  # future step, not done here.
  zap_baseline:
    needs: [prek, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-supabase-cli

      - name: Start Supabase
        run: supabase start
        working-directory: .

      # Same local stack backs both builds below -- read once into
      # GITHUB_ENV rather than re-querying `supabase status` per build.
      - name: Point the build at the local stack
        run: |
          status=$(supabase status -o json)
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL <<< "$status")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY <<< "$status")" >> "$GITHUB_ENV"
        working-directory: .

      - name: Build the signed-out export
        run: npm run build

      # zap-baseline.py always resets its spider to the *host root* of
      # whatever target URL it's given -- any path component is stripped
      # before spidering ("backwards compatibility", docker/zap-baseline.py
      # in zaproxy/zaproxy), so pointing it at .../CollectionBuddy/ directly
      # would silently scan an empty host root instead. The real export only
      # renders correctly under EXPORT_BASE_PATH, though -- next.config.ts
      # bakes it into every asset/navigation URL, the same reason
      # web/scripts/serve-export.mjs exists for Playwright. A self-
      # referencing symlink makes the one built export answer identically at
      # both `/` (what ZAP actually crawls) and `/CollectionBuddy/*` (what
      # the HTML's own URLs point at) -- no second build, nothing rewritten.
      - name: Serve the signed-out export at the site root
        run: |
          ln -s . out/CollectionBuddy
          npx serve out -l 4173 &
          echo $! > /tmp/zap-serve.pid
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4173/ >/dev/null; do sleep 1; done'

      # Baseline = passive only (spider + passive scan rules), never an
      # active scan -- deliberately out of scope per #661. `-I` means only a
      # rule this repo has explicitly promoted to FAIL in .zap/rules.tsv can
      # fail this job; everything else still lands in the report/artifact
      # for human triage, the same graduated-severity split this repo
      # already uses for Opengrep, axe-core (e2e/axe.ts), and Lighthouse
      # (scripts/lighthouse.mjs) above.
      - name: ZAP baseline scan -- signed out
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:4173/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report-signed-out'

      # The action writes report_md.md into the workspace root (the `-w`
      # flag baked into its own zap-baseline.py invocation) in addition to
      # uploading it as part of the artifact above -- same tee-and-cat
      # pattern this file already uses for depcruise/knip/pgTAP, just with
      # the report file written for us instead of by us. Captured now,
      # before the signed-in pass's build overwrites it.
      - name: Add the signed-out ZAP results to the job summary
        if: always()
        working-directory: .
        run: |
          {
            echo '## 🕷️ OWASP ZAP baseline scan -- signed out'
            echo
            cat report_md.md 2>/dev/null || echo '_The scan did not complete far enough to produce a report -- see the step above._'
          } >> "$GITHUB_STEP_SUMMARY"

      # Tear down before rebuilding in the same out/ directory: next build
      # doesn't expect the self-referencing symlink still there, and a
      # lingering `serve` process would otherwise hold the port.
      - name: Stop the signed-out server
        if: always()
        run: |
          kill "$(cat /tmp/zap-serve.pid)" 2>/dev/null || true
          rm -f out/CollectionBuddy

      # NEXT_PUBLIC_DEMO_MODE signs every visitor in as a fresh anonymous
      # user instead of showing the Google button -- the same mechanism
      # scripts/demo.mjs and scripts/lighthouse.mjs already use, since there
      # is no username/password to script in CI otherwise.
      - name: Build the signed-in (demo mode) export
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'

      - name: Serve the signed-in export at the site root
        run: |
          ln -s . out/CollectionBuddy
          npx serve out -l 4174 &
          echo $! > /tmp/zap-serve.pid
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4174/ >/dev/null; do sleep 1; done'

      - name: ZAP baseline scan -- signed in (demo mode)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:4174/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report-signed-in'

      - name: Add the signed-in ZAP results to the job summary
        if: always()
        working-directory: .
        run: |
          {
            echo '## 🕷️ OWASP ZAP baseline scan -- signed in (demo mode)'
            echo
            cat report_md.md 2>/dev/null || echo '_The scan did not complete far enough to produce a report -- see the step above._'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the signed-in server
        if: always()
        run: kill "$(cat /tmp/zap-serve.pid)" 2>/dev/null || true

      - name: Stop Supabase
        if: always()
        run: supabase stop
        working-directory: .
