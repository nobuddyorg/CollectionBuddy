# Hook revs are commit SHAs (a tag can be repointed); Dependabot bumps both the SHA and its `# frozen:` tag.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/crate-ci/typos
    rev: 00f422f3b19c57bc6338715ebfe3316d38768461 # frozen: v1.50.3
    hooks:
      - id: typos
        # German prose reads as misspelled English near word-for-word; the lockfile is a wall of hashes.
        exclude: |
          (?x)^(
            web/src/app/i18n/(de|en)\.json|
            web/public/(privacy-policy|terms-of-service)\.txt|
            web/e2e/signed-in/fixtures\.ts|
            web/package-lock\.json
          )$

  # Staged changes on commit; CI's prek job scans the history instead. Rules and the anon-key allowlist in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor

  # zizmor covers security; actionlint covers syntax, expression types, job references and ShellCheck on run: blocks.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        # Every workflow at once, so an edited composite action re-checks the workflows that call it.
        files: ^\.github/(workflows|actions)/
        pass_filenames: false

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10 # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # Lint only, never `sqlfluff-fix`: migrations are applied history, not reformattable source.
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 8108cc202d2aa2732b21d48507152c95ee244030 # frozen: 4.3.0
    hooks:
      - id: sqlfluff-lint

  # Lock and rewrite hazards sqlfluff cannot see; rules in .squawk.toml.
  - repo: https://github.com/sbdchd/squawk
    rev: 1b906e138fd4f21975a2270885c56cffdc24f22b # frozen: v2.66.0
    hooks:
      - id: squawk
        files: ^supabase/migrations/.*\.sql$
        # 0001-0009 are applied history and predate the lock/statement timeout rules; never edited to satisfy them.
        exclude: ^supabase/migrations/000[1-9]_
        additional_dependencies: ["squawk-cli@2.66.0"]

  # The same commands CI runs, from web/ where their config lives.
  - repo: local
    hooks:
      # Its own pinned install, not a web/ devDependency: CI's prek job runs without node_modules.
      - id: lockfile-lint
        name: lockfile-lint (web)
        entry: lockfile-lint --path web/package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity --validate-package-names
        language: node
        additional_dependencies: ["lockfile-lint@5.0.1"]
        pass_filenames: false
        files: ^web/package-lock\.json$

      - id: prettier
        name: Prettier (web)
        entry: bash -c 'cd web && npx prettier --check .'
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|tsx|js|mjs|json|css)$
        exclude: ^web/package-lock\.json$
        stages: [pre-commit]

      - id: eslint
        name: ESLint (web)
        entry: bash -c 'cd web && npm run lint'
        language: system
        pass_filenames: false
        files: ^web/src/.*\.(ts|tsx)$
        stages: [pre-commit]

      - id: tsc
        name: TypeScript (web)
        entry: bash -c 'cd web && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^web/(src/.*\.(ts|tsx)|tsconfig\.json)$
        stages: [pre-commit]

      # ~1.5s over the whole web graph (measured here), so it runs whole rather than per changed file.
      - id: depcruise
        name: dependency-cruiser (web)
        entry: bash -c 'cd web && npm run depcruise'
        language: system
        pass_filenames: false
        files: ^web/(src/app/.*\.(ts|tsx)|e2e/.*\.ts|scripts/.*\.mjs|tsconfig\.json|\.dependency-cruiser\.mjs)$
        stages: [pre-commit]

      # Scoped to what can change the unused-file/export graph: sources, package.json, its own config.
      - id: knip
        name: Knip -- dead code and unused dependencies (web)
        entry: bash -c 'cd web && npm run knip'
        language: system
        pass_filenames: false
        files: ^web/(src/.*\.(ts|tsx)|e2e/.*\.ts|scripts/.*\.mjs|package\.json|knip\.config\.ts|next\.config\.ts|playwright\.config\.ts|stryker\.config\.mjs|vitest(\.mutation)?\.config\.mts)$
        stages: [pre-commit]
