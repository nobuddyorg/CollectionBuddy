repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.0
    hooks:
      - id: typos
        # German prose reads as misspelled English near word-for-word; the lockfile is a wall of hashes.
        exclude: |
          (?x)^(
            web/src/app/i18n/(de|en)\.json|
            web/public/(privacy-policy|terms-of-service)\.txt|
            web/e2e/signed-in/fixtures\.ts|
            web/package-lock\.json
          )$

  # zizmor: security analysis of the GitHub Actions workflows.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # Lint only, never `sqlfluff-fix`: migrations are applied history, not reformattable source.
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-lint

  # The same commands CI runs, from web/ where their config lives.
  - repo: local
    hooks:
      - id: prettier
        name: Prettier (web)
        entry: bash -c 'cd web && npx prettier --check .'
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|tsx|js|mjs|json|css)$
        exclude: ^web/package-lock\.json$
        stages: [pre-commit]

      - id: eslint
        name: ESLint (web)
        entry: bash -c 'cd web && npm run lint'
        language: system
        pass_filenames: false
        files: ^web/src/.*\.(ts|tsx)$
        stages: [pre-commit]

      - id: tsc
        name: TypeScript (web)
        entry: bash -c 'cd web && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^web/(src/.*\.(ts|tsx)|tsconfig\.json)$
        stages: [pre-commit]

      # ~1.5s over the whole web graph (measured here), so it runs whole rather than per changed file.
      - id: depcruise
        name: dependency-cruiser (web)
        entry: bash -c 'cd web && npm run depcruise'
        language: system
        pass_filenames: false
        files: ^web/(src/app/.*\.(ts|tsx)|e2e/.*\.ts|scripts/.*\.mjs|tsconfig\.json|\.dependency-cruiser\.mjs)$
        stages: [pre-commit]

      # Scoped to what can change the unused-file/export graph: sources, package.json, its own config.
      - id: knip
        name: Knip -- dead code and unused dependencies (web)
        entry: bash -c 'cd web && npm run knip'
        language: system
        pass_filenames: false
        files: ^web/(src/.*\.(ts|tsx)|e2e/.*\.ts|scripts/.*\.mjs|package\.json|knip\.config\.ts|next\.config\.ts|playwright\.config\.ts|stryker\.config\.mjs|vitest(\.mutation)?\.config\.mts)$
        stages: [pre-commit]
